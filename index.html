<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mathpad</title>
    <link rel="stylesheet"href="./style.css" type="text/css" />
    <link rel="stylesheet" href="lib/mathquill.css" />
    <link rel="icon" sizes="96x96" href="./favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js"></script>
    <script src="lib/mathquill.min.js"></script>
</head>

<body>
    <div class="app-content">
        <div class="header">
            <div class="brand">
                <img src="./imgs/logo.svg" alt="Mathpad" draggable="false">
                <span>Mathpad</span>
            </div>
        </div>
        <div class="editor">
            <div class="line-editor">
                <span class="line-number"></span>
                <div class="editable-field"></div>
                <button class="copy-button" title="数式をコピー">
                    <img src="./imgs/copy.svg" alt="数式をコピー" draggable="false">
                </button>
            </div>
        </div>
        <div class="keyboard">
            <div class="keyboard-switcher">
                <div class="switcher-tab-container">
                    <button class="switcher-tab selected" data-tab="basic">123</button>
                    <button class="switcher-tab" data-tab="abc">ABC</button>
                    <button class="switcher-tab" data-tab="fn">fn</button>
                    <button class="switcher-tab" data-tab="set">set</button>
                    <button class="switcher-tab" data-tab="dec">dec</button>
                </div>
            </div>
            <div class="key-panel-container">
                <div class="key-panel showed" data-panel="basic">
                    <div class="key-panel-row">
                        <div class="keyboard-button font-input" data-value="x" role="button"></div>
                        <div class="keyboard-button font-input" data-value="y" role="button"></div>
                        <div class="keyboard-button stretch symbol-input" data-symbol="\pi" role="button"></div>
                        <div class="keyboard-button stretch font-input" data-value="e" role="button"></div>
                        <div class="keyboard-margin"></div>
                        <div class="keyboard-button font-input" data-value="7" role="button"></div>
                        <div class="keyboard-button font-input" data-value="8" role="button"></div>
                        <div class="keyboard-button font-input" data-value="9" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\times" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\div" role="button"></div>
                    </div>
                    <div class="key-panel-row">
                        <div class="keyboard-button cmd-input" data-cmd="⬚^2" role="button"></div>
                        <div class="keyboard-button cmd-input" data-cmd="⬚^⬚" role="button"></div>
                        <div class="keyboard-button stretch cmd-input" data-cmd="\sqrt{⬚}" role="button"></div>
                        <div class="keyboard-button stretch cmd-input" data-cmd="\sqrt[⬚]{⬚}" role="button"></div>
                        <div class="keyboard-margin"></div>
                        <div class="keyboard-button font-input" data-value="4" role="button"></div>
                        <div class="keyboard-button font-input" data-value="5" role="button"></div>
                        <div class="keyboard-button font-input" data-value="6" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="+" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="-" role="button"></div>
                    </div>
                    <div class="key-panel-row">
                        <div class="keyboard-button symbol-input" data-symbol="<" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol=">" role="button"></div>
                        <div class="keyboard-button stretch symbol-input" data-symbol="/" role="button"></div>
                        <div class="keyboard-button stretch small-font cmd-input" data-cmd="\frac{⬚}{⬚}" role="button"></div>
                        <div class="keyboard-margin"></div>
                        <div class="keyboard-button font-input" data-value="1" role="button"></div>
                        <div class="keyboard-button font-input" data-value="2" role="button"></div>
                        <div class="keyboard-button font-input" data-value="3" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="=" role="button"></div>
                        <div class="keyboard-button system stroke-input" data-key="Backspace" role="button">
                            <img src="./imgs/backspace.svg" alt="backspece" draggable="false">
                        </div>
                    </div>
                    <div class="key-panel-row">
                        <div class="keyboard-button symbol-input" data-symbol="\pm" role="button"></div>
                        <div class="keyboard-button cmd-input" data-cmd="|⬚|" role="button"></div>
                        <div class="keyboard-button stretch cmd-input" data-cmd="(" role="button"></div>
                        <div class="keyboard-button stretch cmd-input" data-cmd=")" role="button"></div>
                        <div class="keyboard-margin"></div>
                        <div class="keyboard-button font-input" data-value="0" role="button"></div>
                        <div class="keyboard-button font-input" data-value="." role="button"></div>
                        <div class="keyboard-button system stroke-input" data-key="Left" role="button">
                            <img src="./imgs/chevron-left.svg" alt="arrow-left" draggable="false">
                        </div>
                        <div class="keyboard-button system stroke-input" data-key="Right" role="button">
                            <img src="./imgs/chevron-right.svg" alt="arrow-right" draggable="false">
                        </div>
                        <div class="keyboard-button system stroke-input" data-key="Enter" role="button">
                            <img src="./imgs/arrow-enter.svg" alt="enter" draggable="false">
                        </div>
                    </div>
                </div>
                <div class="key-panel" data-panel="abc">
                    <div class="key-panel-row">
                        <div class="keyboard-button font-input" data-value="q" role="button"></div>
                        <div class="keyboard-button font-input" data-value="w" role="button"></div>
                        <div class="keyboard-button font-input" data-value="e" role="button"></div>
                        <div class="keyboard-button font-input" data-value="r" role="button"></div>
                        <div class="keyboard-button font-input" data-value="t" role="button"></div>
                        <div class="keyboard-button font-input" data-value="y" role="button"></div>
                        <div class="keyboard-button font-input" data-value="u" role="button"></div>
                        <div class="keyboard-button font-input" data-value="i" role="button"></div>
                        <div class="keyboard-button font-input" data-value="o" role="button"></div>
                        <div class="keyboard-button font-input" data-value="p" role="button"></div>
                    </div>
                    <div class="key-panel-row">
                        <div class="keyboard-button font-input" data-value="a" role="button"></div>
                        <div class="keyboard-button font-input" data-value="s" role="button"></div>
                        <div class="keyboard-button font-input" data-value="d" role="button"></div>
                        <div class="keyboard-button font-input" data-value="f" role="button"></div>
                        <div class="keyboard-button font-input" data-value="g" role="button"></div>
                        <div class="keyboard-button font-input" data-value="h" role="button"></div>
                        <div class="keyboard-button font-input" data-value="j" role="button"></div>
                        <div class="keyboard-button font-input" data-value="k" role="button"></div>
                        <div class="keyboard-button font-input" data-value="l" role="button"></div>
                    </div>
                    <div class="key-panel-row">
                        <div class="keyboard-button stretch system" role="button">
                            <img src="./imgs/capslock.svg" alt="capslock" draggable="false">
                        </div>
                        <div class="keyboard-margin"></div>
                        <div class="keyboard-button font-input" data-value="z" role="button"></div>
                        <div class="keyboard-button font-input" data-value="x" role="button"></div>
                        <div class="keyboard-button font-input" data-value="c" role="button"></div>
                        <div class="keyboard-button font-input" data-value="v" role="button"></div>
                        <div class="keyboard-button font-input" data-value="b" role="button"></div>
                        <div class="keyboard-button font-input" data-value="n" role="button"></div>
                        <div class="keyboard-button font-input" data-value="m" role="button"></div>
                        <div class="keyboard-margin"></div>
                        <div class="keyboard-button stretch system stroke-input" data-key="Backspace" role="button">
                            <img src="./imgs/backspace.svg" alt="backspece" draggable="false">
                        </div>
                    </div>
                    <div class="key-panel-row">
                        <div class="keyboard-button system" role="button">αβγ</div>
                        <div class="keyboard-button symbol-input" data-symbol="," role="button"></div>
                        <div class="keyboard-button cmd-input" data-cmd="(" role="button"></div>
                        <div class="keyboard-button cmd-input" data-cmd=")" role="button"></div>
                        <div class="keyboard-button stretch font-input" data-value=" " role="button"></div>
                        <div class="keyboard-button system stroke-input" data-key="Left" role="button">
                            <img src="./imgs/chevron-left.svg" alt="arrow-left" draggable="false">
                        </div>
                        <div class="keyboard-button system stroke-input" data-key="Right" role="button">
                            <img src="./imgs/chevron-right.svg" alt="arrow-right" draggable="false">
                        </div>
                        <div class="keyboard-button system stroke-input" data-key="Enter" role="button">
                            <img src="./imgs/arrow-enter.svg" alt="enter" draggable="false">
                        </div>
                    </div>
                </div>
                <div class="key-panel" data-panel="fn">
                    <div class="key-panel-row">
                        <div class="keyboard-button stretch symbol-input" data-symbol="sin" role="button"></div>
                        <div class="keyboard-button stretch symbol-input" data-symbol="cos" role="button"></div>
                        <div class="keyboard-button stretch symbol-input" data-symbol="tan" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="log" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="ln" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="lg" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="lim" role="button"></div>
                        <div class="keyboard-button cmd-input" data-cmd="⬚_⬚" role="button"></div>
                    </div>
                    <div class="key-panel-row">
                        <div class="keyboard-button stretch symbol-input" data-symbol="arcsin" role="button"></div>
                        <div class="keyboard-button stretch symbol-input" data-symbol="arccos" role="button"></div>
                        <div class="keyboard-button stretch symbol-input" data-symbol="arctan" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\partial" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\int" role="button"></div>
                        <div class="keyboard-button cmd-input" data-cmd="\Sigma" role="button"></div>
                        <div class="keyboard-button cmd-input" data-cmd="\Pi" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\infinity" role="button"></div>
                    </div>
                    <div class="key-panel-row">
                        <div class="keyboard-button stretch symbol-input" data-symbol="sinh" role="button"></div>
                        <div class="keyboard-button stretch symbol-input" data-symbol="cosh" role="button"></div>
                        <div class="keyboard-button stretch symbol-input" data-symbol="tanh" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\degree" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\prime" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="!" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="%" role="button"></div>
                        <div class="keyboard-button system stroke-input" data-key="Backspace" role="button">
                            <img src="./imgs/backspace.svg" alt="enter" draggable="false">
                        </div>
                    </div>
                    <div class="key-panel-row">
                        <div class="keyboard-button stretch symbol-input" data-symbol="max" role="button"></div>
                        <div class="keyboard-button stretch symbol-input" data-symbol="min" role="button"></div>
                        <div class="keyboard-button stretch symbol-input" data-symbol="exp" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="gcd" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="lcm" role="button"></div>
                        <div class="keyboard-button system stroke-input" data-key="Left" role="button">
                            <img src="./imgs/chevron-left.svg" alt="arrow-left" draggable="false">
                        </div>
                        <div class="keyboard-button system stroke-input" data-key="Right" role="button">
                            <img src="./imgs/chevron-right.svg" alt="arrow-right" draggable="false">
                        </div>
                        <div class="keyboard-button system stroke-input" data-key="Enter" role="button">
                            <img src="./imgs/arrow-enter.svg" alt="enter" draggable="false">
                        </div>
                    </div>
                </div>
                <div class="key-panel" data-panel="set">
                    <div class="key-panel-row">
                        <div class="keyboard-button symbol-input" data-symbol="\naturals" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\integers" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\rationals" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\reals" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\complexes" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\primes" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\in" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\notin" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\ni" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\mid" role="button"></div>
                    </div>
                    <div class="key-panel-row">
                        <div class="keyboard-button symbol-input" data-symbol="\subset" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\subseteq" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\supset" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\supseteq" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\cap" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\cup" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\emptyset" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\setminus" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\forall" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\exists" role="button"></div>
                    </div>
                    <div class="key-panel-row">
                        <div class="keyboard-button symbol-input" data-symbol="\land" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\lor" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\neg" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\Rightarrow" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\Leftarrow" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\Leftrightarrow" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\therefore" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\because" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\perp" role="button"></div>
                        <div class="keyboard-button system stroke-input" data-key="Backspace" role="button">
                            <img src="./imgs/backspace.svg" alt="enter" draggable="false">
                        </div>
                    </div>
                    <div class="key-panel-row">
                        <div class="keyboard-button symbol-input" data-symbol="\approx" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\equiv" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\propto" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\sim" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\le" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\ge" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\neq" role="button"></div>
                        <div class="keyboard-button system stroke-input" data-key="Left" role="button">
                            <img src="./imgs/chevron-left.svg" alt="arrow-left" draggable="false">
                        </div>
                        <div class="keyboard-button system stroke-input" data-key="Right" role="button">
                            <img src="./imgs/chevron-right.svg" alt="arrow-right" draggable="false">
                        </div>
                        <div class="keyboard-button system stroke-input" data-key="Enter" role="button">
                            <img src="./imgs/arrow-enter.svg" alt="enter" draggable="false">
                        </div>
                    </div>
                </div>
                <div class="key-panel" data-panel="dec">
                    <div class="key-panel-row">
                        <div class="keyboard-button cmd-input" data-cmd="\vec{⬚}" role="button"></div>
                        <div class="keyboard-button cmd-input" data-cmd="\overline{⬚}" role="button"></div>
                        <div class="keyboard-button cmd-input" data-cmd="\underline{⬚}" role="button"></div>
                        <div class="keyboard-button small-font cmd-input" data-cmd="\binom{⬚}{⬚}" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\lfloor" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\rfloor" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\lceil" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\rceil" role="button"></div>
                        <div class="keyboard-button cmd-input" data-cmd="[" role="button"></div>
                        <div class="keyboard-button cmd-input" data-cmd="]" role="button"></div>
                    </div>
                    <div class="key-panel-row">
                        <div class="keyboard-button cmd-input" data-cmd="\lbrace" role="button"></div>
                        <div class="keyboard-button cmd-input" data-cmd="\rbrace" role="button"></div>
                        <div class="keyboard-button cmd-input" data-cmd="⟨" role="button"></div>
                        <div class="keyboard-button cmd-input" data-cmd="⟩" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="|" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\angle" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\triangle" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\square" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\parallel" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\cong" role="button"></div>
                    </div>
                    <div class="key-panel-row">
                        <div class="keyboard-button symbol-input" data-symbol="\ll" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\gg" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol=":" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\hbar" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\aleph" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\bullet" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\circ" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\star" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\nabla" role="button"></div>
                        <div class="keyboard-button system stroke-input" data-key="Backspace" role="button">
                            <img src="./imgs/backspace.svg" alt="enter" draggable="false">
                        </div>
                    </div>
                    <div class="key-panel-row">
                        <div class="keyboard-button symbol-input" data-symbol="\dots" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\vdots" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\ddots" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\cdots" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\cdot" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\mapsto" role="button"></div>
                        <div class="keyboard-button symbol-input" data-symbol="\dagger" role="button"></div>
                        <div class="keyboard-button system stroke-input" data-key="Left" role="button">
                            <img src="./imgs/chevron-left.svg" alt="arrow-left" draggable="false">
                        </div>
                        <div class="keyboard-button system stroke-input" data-key="Right" role="button">
                            <img src="./imgs/chevron-right.svg" alt="arrow-right" draggable="false">
                        </div>
                        <div class="keyboard-button system stroke-input" data-key="Enter" role="button">
                            <img src="./imgs/arrow-enter.svg" alt="enter" draggable="false">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./script.js" type="text/javascript"></script>
</body>

</html>
