<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mathpad</title>
    <link rel="stylesheet"href="./style.css" type="text/css" />
    <link rel="stylesheet" href="lib/mathquill.css" />
    <link rel="icon" sizes="96x96" href="./favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js"></script>
    <script src="lib/mathquill.min.js"></script>
</head>

<body>
    <div class="app-content">
        <div class="header">
            <div class="brand">
                <img src="./imgs/logo.svg" alt="Mathpad" draggable="false">
                <span>Mathpad</span>
            </div>
        </div>
        <div class="editor">
            <div class="line-editor">
                <span class="line-number"></span>
                <div class="editable-field"></div>
                <button class="copy-button" title="数式をコピー">
                    <img src="./imgs/copy.svg" alt="数式をコピー" draggable="false">
                </button>
            </div>
        </div>
        <div class="keyboard">
            <div class="keyboard-switcher">
                <div class="switcher-tab-container">
                    <button class="switcher-tab selected" data-tab="basic">123</button>
                    <button class="switcher-tab" data-tab="abc">ABC</button>
                    <button class="switcher-tab" data-tab="fn">fn</button>
                </div>
            </div>
            <div class="key-panel-container">
                <div class="key-panel showed" data-panel="basic">
                    <div class="key-panel-row">
                        <button class="keyboard-button font-input" data-value="x"></button>
                        <button class="keyboard-button font-input" data-value="y"></button>
                        <button class="keyboard-button stretch symbol-input" data-symbol="\pi"></button>
                        <button class="keyboard-button stretch font-input" data-value="e"></button>
                        <div class="keyboard-margin"></div>
                        <button class="keyboard-button font-input" data-value="7"></button>
                        <button class="keyboard-button font-input" data-value="8"></button>
                        <button class="keyboard-button font-input" data-value="9"></button>
                        <button class="keyboard-button symbol-input" data-symbol="\times"></button>
                        <button class="keyboard-button symbol-input" data-symbol="\div"></button>
                    </div>
                    <div class="key-panel-row">
                        <button class="keyboard-button cmd-input" data-cmd="⬚^2"></button>
                        <button class="keyboard-button cmd-input" data-cmd="⬚^⬚"></button>
                        <button class="keyboard-button stretch cmd-input" data-cmd="\sqrt{⬚}"></button>
                        <button class="keyboard-button stretch cmd-input" data-cmd="\sqrt[⬚]{⬚}"></button>
                        <div class="keyboard-margin"></div>
                        <button class="keyboard-button font-input" data-value="4"></button>
                        <button class="keyboard-button font-input" data-value="5"></button>
                        <button class="keyboard-button font-input" data-value="6"></button>
                        <button class="keyboard-button symbol-input" data-symbol="+"></button>
                        <button class="keyboard-button symbol-input" data-symbol="-"></button>
                    </div>
                    <div class="key-panel-row">
                        <button class="keyboard-button symbol-input" data-symbol="\pm"></button>
                        <button class="keyboard-button cmd-input" data-cmd="|⬚|"></button>
                        <button class="keyboard-button stretch font-input" data-value="/"></button>
                        <button class="keyboard-button stretch cmd-input" data-cmd="\frac{⬚}{⬚}"></button>
                        <div class="keyboard-margin"></div>
                        <button class="keyboard-button font-input" data-value="1"></button>
                        <button class="keyboard-button font-input" data-value="2"></button>
                        <button class="keyboard-button font-input" data-value="3"></button>
                        <button class="keyboard-button symbol-input" data-symbol="="></button>
                        <button class="keyboard-button system stroke-input" data-key="Backspace">
                            <img src="./imgs/backspace.svg" alt="backspece" draggable="false">
                        </button>
                    </div>
                    <div class="key-panel-row">
                        <button class="keyboard-button symbol-input" data-symbol="!"></button>
                        <button class="keyboard-button symbol-input" data-symbol=","></button>
                        <button class="keyboard-button stretch font-input" data-value="("></button>
                        <button class="keyboard-button stretch font-input" data-value=")"></button>
                        <div class="keyboard-margin"></div>
                        <button class="keyboard-button font-input" data-value="0"></button>
                        <button class="keyboard-button font-input" data-value="."></button>
                        <button class="keyboard-button system stroke-input" data-key="Left">
                            <img src="./imgs/chevron-left.svg" alt="arrow-left" draggable="false">
                        </button>
                        <button class="keyboard-button system stroke-input" data-key="Right">
                            <img src="./imgs/chevron-right.svg" alt="arrow-right" draggable="false">
                        </button>
                        <button class="keyboard-button system stroke-input" data-key="Enter">
                            <img src="./imgs/arrow-enter.svg" alt="enter" draggable="false">
                        </button>
                    </div>
                </div>
                <div class="key-panel" data-panel="abc">
                    <div class="key-panel-row">
                        <button class="keyboard-button font-input" data-value="q"></button>
                        <button class="keyboard-button font-input" data-value="w"></button>
                        <button class="keyboard-button font-input" data-value="e"></button>
                        <button class="keyboard-button font-input" data-value="r"></button>
                        <button class="keyboard-button font-input" data-value="t"></button>
                        <button class="keyboard-button font-input" data-value="y"></button>
                        <button class="keyboard-button font-input" data-value="u"></button>
                        <button class="keyboard-button font-input" data-value="i"></button>
                        <button class="keyboard-button font-input" data-value="o"></button>
                        <button class="keyboard-button font-input" data-value="p"></button>
                    </div>
                    <div class="key-panel-row">
                        <button class="keyboard-button font-input" data-value="a"></button>
                        <button class="keyboard-button font-input" data-value="s"></button>
                        <button class="keyboard-button font-input" data-value="d"></button>
                        <button class="keyboard-button font-input" data-value="f"></button>
                        <button class="keyboard-button font-input" data-value="g"></button>
                        <button class="keyboard-button font-input" data-value="h"></button>
                        <button class="keyboard-button font-input" data-value="j"></button>
                        <button class="keyboard-button font-input" data-value="k"></button>
                        <button class="keyboard-button font-input" data-value="l"></button>
                    </div>
                    <div class="key-panel-row">
                        <button class="keyboard-button stretch system"></button>
                        <div class="keyboard-margin"></div>
                        <button class="keyboard-button font-input" data-value="z"></button>
                        <button class="keyboard-button font-input" data-value="x"></button>
                        <button class="keyboard-button font-input" data-value="c"></button>
                        <button class="keyboard-button font-input" data-value="v"></button>
                        <button class="keyboard-button font-input" data-value="b"></button>
                        <button class="keyboard-button font-input" data-value="n"></button>
                        <button class="keyboard-button font-input" data-value="m"></button>
                        <div class="keyboard-margin"></div>
                        <button class="keyboard-button stretch system stroke-input" data-key="Backspace">
                            <img src="./imgs/backspace.svg" alt="backspece" draggable="false">
                        </button>
                    </div>
                    <div class="key-panel-row">
                        <button class="keyboard-button system">αβγ</button>
                        <button class="keyboard-button font-input" data-value="\">\</button>
                        <button class="keyboard-button font-input" data-value="(">(</button>
                        <button class="keyboard-button font-input" data-value=")">)</button>
                        <button class="keyboard-button stretch font-input" data-value=" "></button>
                        <button class="keyboard-button system stroke-input" data-key="Left">
                            <img src="./imgs/chevron-left.svg" alt="arrow-left" draggable="false">
                        </button>
                        <button class="keyboard-button system stroke-input" data-key="Right">
                            <img src="./imgs/chevron-right.svg" alt="arrow-right" draggable="false">
                        </button>
                        <button class="keyboard-button system stroke-input" data-key="Enter">
                            <img src="./imgs/arrow-enter.svg" alt="enter" draggable="false">
                        </button>
                    </div>
                </div>
                <div class="key-panel" data-panel="fn">
                    <div class="key-panel-row">
                        <button class="keyboard-button symbol-input stretch" data-symbol="\sin"></button>
                        <button class="keyboard-button symbol-input stretch" data-symbol="\cos"></button>
                        <button class="keyboard-button symbol-input stretch" data-symbol="\tan"></button>
                        <button class="keyboard-button symbol-input" data-symbol="\log"></button>
                        <button class="keyboard-button symbol-input" data-symbol="\ln"></button>
                        <button class="keyboard-button symbol-input" data-symbol="\lg"></button>
                        <button class="keyboard-button symbol-input" data-symbol="\lim"></button>
                        <button class="keyboard-button cmd-input" data-cmd="⬚_⬚"></button>
                    </div>
                    <div class="key-panel-row">
                        <button class="keyboard-button symbol-input stretch" data-symbol="\arcsin"></button>
                        <button class="keyboard-button symbol-input stretch" data-symbol="\arccos"></button>
                        <button class="keyboard-button symbol-input stretch" data-symbol="\arctan"></button>
                        <button class="keyboard-button symbol-input" data-symbol="\partial"></button>
                        <button class="keyboard-button symbol-input" data-symbol="\int"></button>
                        <button class="keyboard-button cmd-input" data-cmd="\Sigma"></button>
                        <button class="keyboard-button cmd-input" data-cmd="\Pi"></button>
                        <button class="keyboard-button symbol-input" data-symbol="\infinity"></button>
                    </div>
                    <div class="key-panel-row">
                        <button class="keyboard-button symbol-input stretch" data-symbol="\sinh"></button>
                        <button class="keyboard-button symbol-input stretch" data-symbol="\cosh"></button>
                        <button class="keyboard-button symbol-input stretch" data-symbol="\tanh"></button>
                        <button class="keyboard-button symbol-input" data-symbol="\degree"></button>
                        <button class="keyboard-button symbol-input" data-symbol="\prime"></button>
                        <button class="keyboard-button symbol-input" data-symbol="\max"></button>
                        <button class="keyboard-button symbol-input" data-symbol="\min"></button>
                        <button class="keyboard-button system stroke-input" data-key="Backspace">
                            <img src="./imgs/backspace.svg" alt="enter" draggable="false">
                        </button>
                    </div>
                    <div class="key-panel-row">
                        <button class="keyboard-button symbol-input stretch" data-symbol="gcd"></button>
                        <button class="keyboard-button symbol-input stretch" data-symbol="\lcm"></button>
                        <button class="keyboard-button symbol-input stretch" data-symbol="\exp"></button>
                        <button class="keyboard-button font-input" data-value="{"></button>
                        <button class="keyboard-button font-input" data-value="}"></button>
                        <button class="keyboard-button system stroke-input" data-key="Left">
                            <img src="./imgs/chevron-left.svg" alt="arrow-left" draggable="false">
                        </button>
                        <button class="keyboard-button system stroke-input" data-key="Right">
                            <img src="./imgs/chevron-right.svg" alt="arrow-right" draggable="false">
                        </button>
                        <button class="keyboard-button system stroke-input" data-key="Enter">
                            <img src="./imgs/arrow-enter.svg" alt="enter" draggable="false">
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./script.js" type="text/javascript"></script>
</body>

</html>
